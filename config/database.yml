default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>

development:
  <<: *default
  database: proteinapp2_development

test:
  <<: *default
  database: proteinapp2_test

production:
  <<: *default
  database: proteinapp2_production
  username: proteinapp2
  password: <%= ENV["PROTEINAPP2_DATABASE_PASSWORD"] %>
